<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Train Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="links"><a href="task1.html">Task 1: Train</a><a href="task2.html">Task 2: Hackathon</a><a
            href="task3.html">Task 3: Café</a></nav>
    <main>
        <div class="form-card">
            <header class="banner">Book a train ticket</header>
            <div class="form-inner">
                <form action="#" method="get">
                    <fieldset class="mb-4">
                        <legend class="visually-hidden">Trip type</legend>
                        <div class="trip-choice"><input type="radio" class="btn-check" id="one" name="trip"
                                value="one-way" checked><label for="one" class="btn">One way</label><input type="radio"
                                class="btn-check" id="round" name="trip" value="round-trip"><label for="round"
                                class="btn">Round trip</label></div>
                    </fieldset>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6"><label class="form-label" for="from">From *</label><input
                                class="form-control" id="from" name="from" placeholder="Astana" required></div>
                        <div class="col-md-6"><label class="form-label" for="to">To *</label><input class="form-control"
                                id="to" name="to" placeholder="Almaty" required></div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4"><label class="form-label" for="departure">Departure *</label><input
                                type="date" class="form-control" id="departure" name="departure" required></div>
                        <div class="col-md-4"><label class="form-label" for="return">Return</label><input type="date"
                                class="form-control" id="return" name="return"></div>
                        <div class="col-md-4"><label class="form-label" for="passengers">Passengers</label><select
                                class="form-select" id="passengers" name="passengers">
                                <option value="1">1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                            </select></div>
                    </div>
                    <fieldset class="mb-4">
                        <legend>Carriage class *</legend>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check"><input type="radio" class="form-check-input" id="seat"
                                    name="carriage" value="seat" required><label class="form-check-label"
                                    for="seat">Seat</label></div>
                            <div class="form-check"><input type="radio" class="form-check-input" id="coupe"
                                    name="carriage" value="coupe"><label class="form-check-label"
                                    for="coupe">Coupé</label></div>
                            <div class="form-check"><input type="radio" class="form-check-input" id="sleeper"
                                    name="carriage" value="sleeper"><label class="form-check-label"
                                    for="sleeper">Sleeper</label></div>
                        </div>
                    </fieldset>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6"><label class="form-label" for="phone">Phone *</label>
                            <div class="input-group"><span class="input-group-text prefix">+7</span><input type="tel"
                                    class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required>
                            </div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="email">Email *</label><input type="email"
                                class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="form-check form-switch mb-2"><input type="checkbox" class="form-check-input"
                            role="switch" id="sms" name="sms"><label class="form-check-label" for="sms">Also send the
                            ticket by SMS</label></div>
                    <div class="form-check mb-4"><input type="checkbox" class="form-check-input" id="agree" name="agree"
                            required><label class="form-check-label" for="agree">I agree with the carriage rules
                            *</label></div>
                    <div class="buttons"><button class="btn btn-outline-green" type="reset">Clear</button><button
                            class="btn btn-gold" type="submit">Find trains</button></div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
