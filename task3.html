<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Café Table Reservation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="links"><a href="task1.html">Task 1: Train</a><a href="task2.html">Task 2: Hackathon</a><a
            href="task3.html">Task 3: Café</a></nav>
    <main>
        <div class="form-card">
            <header class="banner">Reserve a table</header>
            <div class="form-inner">
                <form action="#" method="get">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label" for="guest-name">Your name *</label><input
                                class="form-control" id="guest-name" name="guestName" type="text" autocomplete="name"
                                required></div>
                        <div class="col-md-6"><label class="form-label" for="guest-email">Email *</label><input
                                class="form-control" id="guest-email" name="email" type="email" autocomplete="email"
                                required></div>
                        <div class="col-md-6"><label class="form-label" for="phone">Phone *</label><input
                                class="form-control" id="phone" name="phone" type="tel" autocomplete="tel" required>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="people">Guests *</label><input
                                class="form-control" id="people" name="guests" type="number" min="1" max="20" step="1"
                                required></div>
                        <div class="col-md-6"><label class="form-label" for="date">Date *</label><input
                                class="form-control" id="date" name="date" type="date" required></div>
                        <div class="col-12">
                            <fieldset>
                                <legend>Seating *</legend>
                                <div class="d-flex flex-wrap gap-3">
                                    <div class="form-check"><input class="form-check-input" type="radio" id="inside"
                                            name="seating" value="inside" required><label class="form-check-label"
                                            for="inside">Inside</label></div>
                                    <div class="form-check"><input class="form-check-input" type="radio" id="terrace"
                                            name="seating" value="terrace"><label class="form-check-label"
                                            for="terrace">Terrace</label></div>
                                </div>
                            </fieldset>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="meal">Meal *</label><select
                                class="form-select" id="meal" name="meal" required>
                                <option value="" disabled selected>Choose a meal</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                            </select></div>
                        <div class="col-12"><label class="form-label" for="comments">Comments</label><textarea
                                class="form-control" id="comments" name="comments"
                                placeholder="Special requests (optional)"></textarea></div>
                        <div class="col-12">
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="terms"
                                    name="terms" required><label class="form-check-label" for="terms">I agree to the
                                    terms *</label></div>
                        </div>
                        <div class="col-12 buttons"><button class="btn btn-outline-green"
                                type="reset">Clear</button><button class="btn btn-gold" type="submit">Reserve</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
